# Every push and every pull request. The release workflow depends on this one passing, so a
# tag cannot cut a release over a red suite.
#
# The matrix is not decoration. batten branches on runtime.GOOS in three places that decide
# whether a guard holds:
#
#   - store.normPath case-folds on Windows and macOS, where the default filesystem is
#     case-insensitive, and stays exact on Linux. A write-set guard that got this wrong would let
#     an agent cross the fence by changing a letter's case.
#   - the statusline and the hook command resolve executables differently on Windows.
#
# Windows is the primary target for this tool. A Linux-only CI would never run the code path that
# matters most.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # shell: bash on every step, including the Windows leg. The default shell there is
      # PowerShell, which splits a native command's `-flag=value` argument at the `=` — so
      # `go test -coverprofile=coverage.out ./...` reached go as two arguments and it tried to
      # build a package literally named ".out". Git Bash ships on all three runner images, so
      # one shell for all of them is both the fix and one less thing to differ per platform.
      - name: build
        shell: bash
        run: go build ./...

      - name: vet
        shell: bash
        run: go vet ./...

      - name: test
        shell: bash
        run: go test -coverprofile=coverage.out ./...

      - name: coverage summary
        shell: bash
        run: go tool cover -func=coverage.out | tail -1

  # The race detector needs CGO and a C toolchain, which the shipped binaries deliberately do
  # not (modernc.org/sqlite is pure Go, so releases build with CGO_ENABLED=0 and cross-compile).
  # Rather than make every matrix leg depend on a C compiler, race runs once where it is
  # cheapest and most reliable. It catches what a hook process would only hit under real
  # concurrency, where the symptom is a corrupted verdict rather than a crash.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  # gofmt and tidiness, once — they are platform-independent and do not need the matrix.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # plugin/claude-code/scripts/* are COPIES that build-plugin.sh makes, and they are committed
      # because a marketplace install needs them present. That makes it possible to edit the
      # source and ship the stale copy, which is how the bootstrap came to be missing from the
      # package once already.
      - name: the plugin's bootstrap copies are in sync
        run: |
          for s in bootstrap.sh bootstrap.ps1 bootstrap.cmd; do
            diff "scripts/$s" "plugin/claude-code/scripts/$s" || exit 1
          done

      - name: shell scripts parse
        run: |
          for f in scripts/*.sh plugin/claude-code/scripts/*.sh; do
            bash -n "$f" || exit 1
          done

      # This repo is authored on Windows, where git does not track the execute bit and nothing
      # local ever notices its absence. Both bootstrap.sh copies were committed 100644, so
      # `${CLAUDE_PLUGIN_ROOT}/scripts/bootstrap.sh` was Permission denied on macOS and Linux —
      # the two platforms this machine cannot reproduce. Same class as the CRLF problem
      # .gitattributes solves, and it needed the same treatment: the repo decides, not the
      # developer's filesystem.
      #
      # `grep -v` exits 1 when everything is 100755, so the obvious `... | grep -v '^100755' &&
      # exit 1` fails the step on a HEALTHY tree under `bash -e`. Capture, then decide.
      # internal/install checks this too, on all three runners; this is the fast reading.
      - name: every tracked shell script has the execute bit
        run: |
          bad="$(git ls-files -s '*.sh' | grep -v '^100755' || true)"
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "^ tracked without +x: Permission denied on macOS and Linux."
            echo "  Fix: git update-index --chmod=+x <file>"
            exit 1
          fi

      # This repo is public and was authored on one machine. Absolute home paths and private
      # working files have both reached git here before; four private files had to be purged
      # from the whole history once. Catch the next one at the pull request instead.
      #
      # The separator is `[/\\]+`, not `[/\\]`, and that plus sign is the whole lesson. This
      # guard ran green for weeks while `.claude/settings.json` carried
      # `C:\\Users\\arthu\\...` — a JSON string escapes its backslashes, so the tracked bytes
      # hold TWO separators where the pattern demanded exactly one, and the one file most
      # likely to hold a machine-specific absolute path is a JSON settings file. A guard that
      # cannot see the most probable instance of what it guards against is the failure this
      # project exists to eliminate, committed by the check meant to prevent it.
      - name: no personal paths or private files are tracked
        run: |
          fail=0
          if git grep -In -e 'C:[/\\]\+Users[/\\]\+[a-zA-Z0-9._-]\+[/\\]' -e '/home/[a-zA-Z0-9._-]\+/' \
               -e '/Users/[a-zA-Z0-9._-]\+/' \
               -- . ':!go.sum' ':!graphify-out' ':!.github/workflows/ci.yml'; then
            echo "^ an absolute home path is tracked; use ~ or a placeholder"
            fail=1
          fi
          if git ls-files | grep -E '\.(local\.md|pdf)$|^[^/]*\.canvas$'; then
            echo "^ private working material is tracked; it belongs in .gitignore"
            fail=1
          fi
          exit $fail

      # The other half of the same problem, and it needs the OPPOSITE exclusion list.
      #
      # The guard above hunts for personal PATHS and skips `graphify-out` because a 2 MB generated
      # JSON is unreviewable in a diff. A token is not a path: the name of the private project
      # batten was field-tested against is exactly the kind of string that rides into `graph.json`
      # when `graphify update .` runs without `--code-only`, and that file is the one place in this
      # repo where something private can land without a human or a check ever seeing it. So this
      # step does NOT inherit `:!graphify-out` — the path exclusion is precisely the hole.
      #
      # The pattern is masked with single-character classes on purpose: it matches the real token,
      # and the bytes of the files that carry the pattern — this one, and the plan that documents
      # it — do not match themselves. Without the masking the guard fails on its own source, and
      # the "fix" would be an exclusion that blinds it. The `\b` is not decoration either: without
      # a word boundary the second token matches inside ordinary Spanish words.
      #
      # NOTHING is excluded. `docs/field-test/` was, while the decision about it was open; that
      # directory has been retired from the tree, so the exclusion went with it rather than staying
      # as a hole nobody remembered. Code, tests, scripts, docs and the generated graph are in scope.
      #
      # There is no `-I`, and that is the second half of the same lesson. Dropping `:!graphify-out`
      # was not enough: `.gitattributes` marks the three generated artifacts `-diff` so a rebuild
      # does not bury real changes, and `git grep -I` skips `-diff` files as binary. The attribute
      # that keeps the graph out of diffs also kept it out of the grep — a token planted in
      # `graph.json` walked past a guard that had already dropped the path exclusion. "Binary file
      # ... matches" is the right output for a minified 2 MB JSON; it is also the only one.
      #
      # `git grep` exits 1 on no-match, which under `bash -e` would fail the step on a HEALTHY
      # tree. Same trap as the `grep -v` above: capture first, decide after.
      - name: no private-project tokens are tracked
        run: |
          hits="$(git grep -nE '[p]royecto[_]ui|\bM[N]A\b' -- . || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "^ the private field-test subject is named in this repo."
            echo "  Use the neutral fixture name (replica-ui), or describe the repo without naming it."
            exit 1
          fi

      # The download name in bootstrap.sh and the archive name GoReleaser builds are one contract
      # written in two files. When they drifted, every platform's first-run install 404'd.
      - name: bootstrap and goreleaser agree on the archive name
        run: |
          grep -q 'batten_${os}_${arch}.tar.gz' scripts/bootstrap.sh
          grep -q '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}' .goreleaser.yaml
          if grep -q '{{ .Version }}' .goreleaser.yaml; then
            echo "archives.name_template carries a version; releases/latest/download cannot predict it"
            exit 1
          fi

  # The spec is published for editors to validate against, so it must itself be valid — and
  # every example must satisfy it. An example that does not load is worse than no example.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: every example validates against the schema
        run: |
          python -m pip install --quiet jsonschema pyyaml
          python - <<'PY'
          import glob, json, sys, yaml
          from jsonschema import Draft202012Validator
          schema = json.load(open('batten.schema.json', encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          v, bad = Draft202012Validator(schema), False
          for f in sorted(glob.glob('examples/*/batten.yaml')) + ['batten.yaml']:
              errs = sorted(v.iter_errors(yaml.safe_load(open(f, encoding='utf-8'))), key=lambda e: list(e.path))
              print(('FAIL ' if errs else 'ok   ') + f)
              for e in errs[:5]:
                  print('   ', list(e.path), e.message[:200])
              bad |= bool(errs)
          sys.exit(1 if bad else 0)
          PY

      - name: every example loads in the real parser
        run: |
          go build -o /tmp/batten ./cmd/batten
          for f in examples/*/batten.yaml; do
            d="$(mktemp -d)"; cp "$f" "$d/batten.yaml"
            ( cd "$d" && /tmp/batten doctor ) || exit 1
          done
