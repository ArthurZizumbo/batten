# Cuts a release when a v* tag is pushed: GoReleaser builds every platform's static binary
# and attaches them to a GitHub Release. The plugin's SessionStart bootstrap then downloads the
# right one on first use, so a marketplace install works with no manual binary step.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
