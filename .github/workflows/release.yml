# Cuts a release when a v* tag is pushed: GoReleaser builds every platform's static binary
# and attaches them to a GitHub Release. The plugin's SessionStart bootstrap then downloads the
# right one on first use, so a marketplace install works with no manual binary step.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # A tag must not be able to publish binaries over a red suite. This runs the same checks CI
  # runs on every push, on every platform batten ships to, before GoReleaser is allowed to start.
  verify:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
        shell: bash
      - run: go vet ./...
        shell: bash
      - run: go test ./...
        shell: bash

      # The tag is what GoReleaser stamps into the binary, but the plugin manifest and the
      # marketplace entry carry a version written by hand. Nothing has ever compared them, so
      # v0.2.0 could ship a plugin that introduces itself as 0.1.0 — and the marketplace, not
      # the binary, is what a user reads before installing.
      - name: the manifests agree with the tag
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          for f in plugin/claude-code/.claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            found="$(grep -o '"version": *"[^"]*"' "$f" | head -1 | sed 's/.*"version": *"//;s/"//')"
            if [ "$found" != "$tag" ]; then
              echo "$f declares version $found, but the tag is $tag"
              fail=1
            fi
          done
          exit $fail

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
