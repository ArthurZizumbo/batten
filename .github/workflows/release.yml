# Cuts a release when a v* tag is pushed: GoReleaser builds every platform's static binary
# and attaches them to a GitHub Release. The plugin's SessionStart bootstrap then downloads the
# right one on first use, so a marketplace install works with no manual binary step.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # A tag must not be able to publish binaries over a red suite. This runs the same checks CI
  # runs on every push, on every platform batten ships to, before GoReleaser is allowed to start.
  verify:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
