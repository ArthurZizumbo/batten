# batten governing its own development (dogfood).
# This is the spec for the batten repo itself. enforcement: report while we bring it up —
# it warns instead of denying, so it can't get in the way of active work.
version: 1
project: batten

unit:
  name: TASK
  pattern: 'TASK-\d+'

# During bring-up the gates advise; flip to `enforce` once trusted.
enforcement: report

artifacts:
  handoff: docs/tasks/{id}.md

phases:
  - id: build
    fanout: true
    anchor: git_sha
  - id: verify
    gate: qa
    diff_from: anchor
  - id: close
    requires_verdict: ok

domains:
  cmd:
    path: cmd/
    check: ['go build ./...', 'go vet ./...']
    invariants:
      - never write state under CLAUDE_PLUGIN_ROOT (wiped on update); state lives in ~/.batten
      - a hook must degrade, never break a session
  internal:
    path: internal/
    check: ['go build ./...', 'go test ./...']
    invariants:
      - never invent a number; unmeasurable reports as unavailable, not zero
      - fail-open only with a visible warning

gates:
  qa:
    checks: ['go build ./...', 'go vet ./...', 'go test ./...']
    verdict: required
    evidence: required

budget:
  tokens_per_run: 5000000
  on_exceed: warn

capabilities:
  memory:
    provider: engram
  graph:
    provider: graphify   # el grafo del CÓDIGO; los agentes preguntan antes de escribir
    lessons: false       # engram es dueño de lo episódico
  obsidian:
    # Your vault goes in the ENVIRONMENT, not here: `export BATTEN_VAULT=~/path/to/vault`
    # (setx on Windows). BATTEN_VAULT wins over this key, for the same reason BATTEN_DB exists.
    #
    # This file is committed, and in a public repo it is also the example everybody reads. A real
    # vault path here publishes one person's folder layout — down to which cloud drive they sync
    # it through — and hands every cloner a spec that writes into a directory they do not have.
    # A leading ~ expands; an absolute path is worse, and CI rejects it outright.
    vault: '~/vaults/batten'
    export: [runs, verdicts, canvas]
